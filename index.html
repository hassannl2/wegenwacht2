</style></head><body>
<div class="layout"><aside><div class="brand"><span class="ic" id="ic"></span><span id="sn"></span></div><nav id="nav"></nav><div class="foot"><a id="dc" class="dcl" style="display:none">💬 Discord-server</a><div id="who" class="who"></div></div></aside><div class="content"><div id="ph" class="ph"></div><main id="app"><div class="card">Laden…</div></main></div></div>
<div id="gate" class="gate"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEF={ranks:[{n:"Rekruut"},{n:"Wegenwacht"},{n:"Senior Wegenwacht"},{n:"Teamleider"},{n:"Manager"}],discord:"",siteName:"Wegenwacht",icon:"🚗",accent:"#ffb400",accent2:"#ff7a00",theme:"auto",welcome:"",specs:["Pechhulp","Berging","Verkeersregelaar","Eerste hulp"]};
let uid=null,mgr=false,members={},cfg=DEF,priv=null,loaded=false,offset=0;
const now=()=>Date.now()+offset;
const live=m=>(m.total||0)+(m.since?Math.max(0,Math.floor((now()-m.since)/1000)):0);
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+"u "+String(m).padStart(2,"0")+"m "+String(x).padStart(2,"0")+"s"};
const av=(n,z)=>`<span class="av${z?" "+z:""}">${esc((n||"?").trim().charAt(0).toUpperCase())}</span>`;
const hrs=s=>(s/3600).toFixed(1);
const rankIdx=m=>Math.min(m.rank||0,cfg.ranks.length-1);
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const r=await fetch(path,o);
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok)throw{code:r.status,msg:j&&j.error};
  return j;
}
function showGate(){
  const g=$("#gate"),e=new URLSearchParams(location.search).get("e");
  const msgs={noaccess:"Je hebt geen toegang. Je moet lid zijn van de Discord-server met de juiste rol.",denied:"Inloggen is geannuleerd.",state:"Inloggen is mislukt. Probeer het opnieuw.",error:"Er ging iets mis bij het inloggen. Probeer het opnieuw."};
  g.innerHTML=`<div class="card"><div class="ic" style="width:56px;height:56px;font-size:26px;margin:0 auto 14px">${esc(cfg.icon)}</div><h2 style="font-size:22px">${esc(cfg.siteName)}</h2><p class="mu">Log in met je Discord-account om verder te gaan.</p>${e&&msgs[e]?`<p style="color:var(--bad)">${msgs[e]}</p>`:""}<a class="dcb" href="/auth/login">Inloggen met Discord</a></div>`;
  g.style.display="grid";
}
async function load(){
  try{
    const r=await api("/api/state");
    members=r.members;cfg=Object.assign({},DEF,r.config);priv=r.priv||null;mgr=!!r.mgr;uid=r.me;offset=r.now-Date.now();
    if(!loaded){loaded=true;$("#gate").style.display="none";if(location.search)history.replaceState(null,"","/")}
    render();
  }catch(e){if(e&&e.code===401){loaded=false;showGate()}else console.error(e)}
}
async function act(path,body){
  try{await api(path,body||{})}
  catch(e){if(e.code===401){loaded=false;showGate();return}alert("Mislukt"+(e.msg?": "+e.msg:"."))}
  await load();
}
async function logout(){await fetch("/auth/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});location.reload()}
const clockIn=()=>act("/api/clock/in");
const clockOut=id=>id===uid?act("/api/clock/out"):act("/api/mgr/clockout/"+encodeURIComponent(id));
const setRank=(id,i)=>act("/api/mgr/member/"+encodeURIComponent(id),{rank:i});

function delMember(id){if(confirm("Lid "+members[id].name+" verwijderen? Bij de volgende login wordt het account opnieuw aangemaakt met 0 uur."))return act("/api/mgr/member/"+encodeURIComponent(id)+"/delete")}
function promoteAll(){if(confirm("Alle leden die genoeg uren hebben nu promoveren?"))return act("/api/mgr/promote-all")}

let rk=null,sp=null;
function syncRk(){const rows=document.querySelectorAll("[data-rk]");if(rows.length)rk=[...rows].map(r=>({n:r.querySelector(".rn").value,h:parseFloat(r.querySelector(".rh").value)||0}))}
function addRk(){syncRk();rk.push({n:"Nieuwe rang",h:(rk.length?rk[rk.length-1].h:0)+10});render()}
function delRk(i){syncRk();if(rk.length>1){rk.splice(i,1);render()}}
function H(i){return priv&&priv.hours?priv.hours[i]:(cfg.ranks[i]||{}).h}
const MS=[["overzicht","📊 Overzicht"],["uiterlijk","🎨 Uiterlijk"],["lijst","📋 Ledenlijst"],["leden","👥 Leden beheren"],["discord","💬 Discord"],["specs","🛠️ Specialisaties"],["rangen","🏅 Rangen & promotie"]];
let mopen=false;
let msec="overzicht";
let q="";
function filt(v){q=v.trim().toLowerCase();document.querySelectorAll(".mrow").forEach(r=>r.style.display=r.dataset.s.includes(q)?"":"none")}
function goM(x){msec=x;rk=null;sp=null;q="";render()}
function chipsFor(m){const l=(m.specs||[]).filter(x=>cfg.specs.includes(x));return l.length?`<div class="chips">${l.map(x=>`<span class="chip on">${esc(x)}</span>`).join("")}</div>`:`<p class="mu" style="margin:0">Nog geen specialisaties. Een manager kan ze aan je toekennen.</p>`}
function syncSp(){const rows=document.querySelectorAll("[data-sp]");if(rows.length)sp=[...rows].map(r=>r.querySelector(".rn").value)}
function addSp(){syncSp();sp.push("");render()}
function delSp(i){syncSp();sp.splice(i,1);render()}
function saveUi(){const g=id=>$("#"+id).value;return act("/api/mgr/config",{siteName:g("c_sn"),icon:g("c_ic"),accent:g("c_a1"),accent2:g("c_a2"),theme:g("c_th"),welcome:g("c_wl")})}

async function saveRanks(){syncRk();const body={ranks:rk,auto:$("#c_au").checked};rk=null;await act("/api/mgr/config",body)}
function saveMember(id){
  const r=document.querySelector('[data-m="'+id+'"]'),m=members[id];
  const b={name:r.querySelector(".mn").value,rank:parseInt(r.querySelector(".mr").value)||0,specs:[...r.querySelectorAll(".ms:checked")].map(x=>x.value)};

  return act("/api/mgr/member/"+encodeURIComponent(id),b);
}
function applyCfg(){
  const c=cfg,R=document.documentElement,hex=c.accent||"#ffb400";
  const n=parseInt(hex.slice(1),16),L=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;
  R.style.setProperty("--ac",hex);R.style.setProperty("--ac2",c.accent2||hex);R.style.setProperty("--acx",L>.6?"#1a1300":"#ffffff");

function go(v){if(v==="mgmt"){mopen=view==="mgmt"?!mopen:true}else mopen=false;view=v;rk=null;sp=null;render()}
function render(light){

  $("#who").innerHTML=me?`${av(me.name)}<div><b>${esc(me.name)}</b><div class="mu" style="font-size:12px">${esc(cfg.ranks[rankIdx(me)].n)}${mgr?" · management":""}</div></div>`:(mgr?'<span class="mu">management</span>':"");

  if(mgr)items.push(["mgmt","🛡️ Management"]);
  if(!items.some(i=>i[0]===view))view="mijn";
  $("#nav").innerHTML=items.map(i=>`<button class="${view===i[0]?"on":""}" onclick="go('${i[0]}')">${i[1]}${i[2]!==undefined?`<span class="n">${i[2]}</span>`:""}${i[0]==="mgmt"?`<span class="n" style="background:transparent;color:inherit;font-size:14px">${mopen?"▾":"▸"}</span>`:""}</button>`+(i[0]==="mgmt"&&mopen?`<div class="sub">${MS.map(x=>`<button class="${msec===x[0]?"on":""}" onclick="goM('${x[0]}')">${x[1]}</button>`).join("")}</div>`:"")).join("");
  const PH={mijn:["Mijn dienst","Klok in en uit en bekijk je uren."],online:["Nu online","Wie er op dit moment in dienst is."],lb:["Leaderboard","De leden met de meeste uren."],mgmt:["Management","Instellingen en beheer van de wegenwacht."]};
  $("#ph").innerHTML=`<h1>${PH[view][0]}</h1><p class="mu">${PH[view][1]}</p>`;
  let h="";
  if(view==="mijn"){
    if(!me)h=`<div class="card welcome"><div class="ic" style="width:56px;height:56px;font-size:26px;margin-bottom:12px">${esc(cfg.icon)}</div><h2 style="font-size:22px">Welkom bij ${esc(cfg.siteName)}</h2>${cfg.welcome?`<p>${esc(cfg.welcome)}</p>`:""}<p class="mu">Vul je naam in (bijv. je Discord- of RP-naam) om mee te doen.</p><div class="row"><input id="nm" placeholder="Jouw naam"><button class="p" onclick="join()">Aanmelden</button></div></div>`;
    else{
      const nx=cfg.ranks[rankIdx(me)+1];
      h=`<div class="hero"><div><span class="eyebrow">${me.since?"● In dienst":"Niet in dienst"}</span><div class="hn">Hoi ${esc(me.name)} 👋</div><p>${me.since?`Ingeklokt sinds ${new Date(me.since).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})} · deze dienst ${fmt((now()-me.since)/1000)}`:"Klaar om te beginnen? Klok in om je uren te tellen."}</p></div>${me.since?`<button class="hb" onclick="clockOut('${uid}')">⏹ Uitklokken</button>`:`<button class="hb" onclick="clockIn('${uid}')">▶ Inklokken</button>`}</div>
      <div class="stats"><div class="stat"><span class="mu">⏱ Totaal uren</span><b>${hrs(live(me))}</b></div><div class="stat"><span class="mu">🏅 Rang</span><b class="sm">${esc(cfg.ranks[rankIdx(me)].n)}</b></div>${nx?`<div class="stat"><span class="mu">🎯 Volgende rang</span><b class="sm">${esc(nx.n)}</b>${mgr?`<span class="mu">bij ${H(rankIdx(me)+1)} uur</span>`:""}</div>`:""}</div><div class="card"><h2>Mijn specialisaties</h2>${chipsFor(me)}</div>${cfg.welcome?`<div class="card note">${esc(cfg.welcome)}</div>`:""}`}
  }
  if(view==="online")h=on.length?`<div class="pgrid">`+on.map(m=>`<div class="pc"><div class="row">${av(m.name,"l")}<div style="margin-left:12px"><b>${esc(m.name)}</b><div class="mu">${esc(cfg.ranks[rankIdx(m)].n)}</div></div></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="st"><span class="dot"></span>${fmt((now()-m.since)/1000)}</span>${mgr?`<button class="s r" onclick="clockOut('${m.id}')">Uitklokken</button>`:""}</div></div>`).join("")+`</div>`:`<div class="card empty"><div class="big">😴</div><p class="mu">Niemand is momenteel in dienst.</p></div>`;
  if(view==="lb"){
    if(!lb.length)h=`<div class="card empty"><div class="big">🏆</div><p class="mu">Nog geen leden.</p></div>`;
    else{
      const maxT=Math.max(1,lb[0].t),rn=m=>esc(cfg.ranks[rankIdx(m)].n);
      const pod=(m,i)=>m?`<div class="pod p${i+1}"><div class="medal">${["🥇","🥈","🥉"][i]}</div>${av(m.name,"l")}<b>${esc(m.name)}${m.since?'<span class="dot" style="margin:0 0 0 8px"></span>':""}</b><span class="mu">${rn(m)}</span><span class="pv">${hrs(m.t)} u</span></div>`:"<div></div>";
      h=`<div class="podium">${pod(lb[1],1)}${pod(lb[0],0)}${pod(lb[2],2)}</div>`;
      if(lb.length>3)h+=`<div class="card"><h2>Overige leden</h2>`+lb.slice(3).map((m,i)=>{const nx=cfg.ranks[rankIdx(m)+1],ready=mgr&&nx&&m.t/3600>=H(rankIdx(m)+1);return `<div class="lrow"><span class="num">${i+4}</span>${av(m.name)}<div class="grow"><b>${esc(m.name)}</b>${m.since?'<span class="dot" style="margin:0 0 0 8px"></span>':""}<div class="bar"><i style="width:${Math.max(2,m.t/maxT*100)}%"></i></div></div><span class="tag">${rn(m)}</span>${ready?'<span class="pill">klaar voor promotie</span>':""}<b class="hv">${hrs(m.t)} u</b></div>`}).join("")+`</div>`;
    }
  }
  if(view==="mgmt"){
    if(!MS.some(x=>x[0]===msec))msec="overzicht";
    h="";
    if(msec==="overzicht"){
      const tg=m=>{const t=m.t/3600;let b=0;cfg.ranks.forEach((r,i)=>{if(t>=H(i))b=i});return b};const rdy=list.filter(m=>tg(m)>rankIdx(m)).sort((a,b)=>b.t-a.t);
      h+=`<div class="stats"><div class="stat"><span class="mu">Leden</span><b>${list.length}</b></div><div class="stat"><span class="mu">Nu online</span><b>${on.length}</b></div><div class="stat"><span class="mu">Totaal uren</span><b>${hrs(list.reduce((a,m)=>a+m.t,0))}</b></div><div class="stat"><span class="mu">Klaar voor promotie</span><b>${rdy.length}</b></div></div>
      <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><div class="row"><h2 style="margin:0">Klaar voor promotie</h2><span class="tag">${rdy.length}</span></div>${rdy.length>1?`<button class="p" onclick="promoteAll()">Promoveer iedereen</button>`:""}</div>
      ${rdy.length?rdy.map(m=>{const t=tg(m);return `<div class="lrow">${av(m.name)}<div class="grow"><b>${esc(m.name)}</b><div class="mu" style="font-size:13px">${hrs(m.t)} uur · vereist ${H(t)} uur</div></div><span class="tag">${esc(cfg.ranks[rankIdx(m)].n)}</span><span class="mu">➜</span><span class="pill" style="margin:0">${esc(cfg.ranks[t].n)}</span><button class="s p" onclick="setRank('${m.id}',${t})">Promoveer</button></div>`}).join(""):`<div class="empty" style="padding:28px 10px"><div class="big">✅</div><p class="mu" style="margin:6px 0 0">Niemand hoeft nu gepromoveerd te worden.</p></div>`}
      <div class="row" style="justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--br)"><span class="mu">Automatische promotie elke maandag: <b style="color:var(--tx)">${priv&&priv.auto?"aan":"uit"}</b></span><button class="s" onclick="goM('rangen')">Instellen</button></div></div>`;
    }
    if(msec==="uiterlijk")h+=`<div class="card"><h2>Uiterlijk</h2>
      <div class="fg">
        <label class="f">Websitenaam<input id="c_sn" value="${esc(cfg.siteName)}"></label>
        <label class="f">Icoon (emoji)<input id="c_ic" value="${esc(cfg.icon)}" maxlength="4"></label>
        <label class="f">Kleur 1<input id="c_a1" type="color" value="${esc(cfg.accent)}"></label>
        <label class="f">Kleur 2<input id="c_a2" type="color" value="${esc(cfg.accent2)}"></label>
        <label class="f">Thema<select id="c_th">${[["auto","Automatisch"],["light","Licht"],["dark","Donker"]].map(o=>`<option value="${o[0]}"${cfg.theme===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></label>
      </div>
      <label class="f">Welkomsttekst (bovenaan Mijn dienst)<textarea id="c_wl" rows="2">${esc(cfg.welcome)}</textarea></label>
      <div class="row" style="margin-top:12px"><button class="p" onclick="saveUi()">Opslaan</button></div></div>`;
    if(msec==="specs"){
      if(!sp)sp=[...cfg.specs];
      h+=`<div class="card"><h2>Specialisaties</h2><p class="mu">Welke specialisaties leden kunnen hebben. Je kent ze toe bij Leden beheren.</p>${sp.map((x,i)=>`<div class="row rr" data-sp><input class="rn" value="${esc(x)}" placeholder="Naam"><button class="s r" onclick="delSp(${i})">✕</button></div>`).join("")}<div class="row"><button onclick="addSp()">+ Specialisatie toevoegen</button><button class="p" onclick="saveSpecs()">Opslaan</button></div></div>`;
    }
    if(msec==="rangen"){
      if(!rk)rk=cfg.ranks.map((x,i)=>({n:x.n,h:H(i)}));
      h+=`<div class="card"><h2>Rangen &amp; promotie</h2>
      <label class="row"><input id="c_au" type="checkbox"${priv&&priv.auto?" checked":""}> Elke maandag automatisch promoveren naar de hoogste rang waarvoor iemand genoeg uren heeft</label>
      <p class="mu">Wordt uitgevoerd zodra een manager de site opent op of na maandag. ${priv&&priv.lastRun?`Laatst uitgevoerd voor de week van ${esc(priv.lastRun)} (${priv.lastCount||0} promoties).`:""}</p>
      <h3>Rangen en vereiste uren</h3><p class="mu" style="margin-top:0">Alleen zichtbaar voor management.</p>
      ${rk.map((x,i)=>`<div class="row rr" data-rk><input class="rn" value="${esc(x.n)}" placeholder="Naam"><input class="rh" type="number" min="0" step="0.5" value="${x.h}"><span class="mu">uur</span><button class="s r" onclick="delRk(${i})">✕</button></div>`).join("")}
      <div class="row"><button onclick="addRk()">+ Rang toevoegen</button><button class="p" onclick="saveRanks()">Opslaan</button><button onclick="runNow()">Promoties nu uitvoeren</button></div></div>`;
    }
    if(msec==="lijst"){
      const groups=cfg.ranks.map((r,i)=>({r,i,ms:list.filter(m=>rankIdx(m)===i).sort((a,b)=>b.t-a.t)})).reverse();
      h+=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Alle leden van de wegenwacht (${list.length})</h2><input placeholder="Zoeken…" oninput="filt(this.value)"></div></div>`+groups.map(g=>`<div class="card"><h2>${esc(g.r.n)} <span class="tag">${g.ms.length}</span></h2>${g.ms.length?g.ms.map(m=>`<div class="mrow row" data-s="${esc((m.name||"").toLowerCase())}" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--br)"><span>${av(m.name)}${esc(m.name)}${m.since?'<span class="dot" style="margin-left:8px"></span>':""}</span>${(m.specs&&m.specs.length)?`<span class="mu" style="font-size:12px">${esc(m.specs.filter(x=>cfg.specs.includes(x)).join(" · "))}</span>`:""}<span class="mu">${hrs(m.t)} uur</span></div>`).join(""):`<p class="mu" style="margin:0">Geen leden.</p>`}</div>`).join("");
    }
    if(msec==="leden"){
      const mem=[...list].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
      h+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Leden beheren (${mem.length})</h2><input placeholder="Zoeken…" value="${esc(q)}" oninput="filt(this.value)"></div>${mem.length?`<div class="sc"><table><tr><th>Naam</th><th>Rang</th><th>Uren</th><th>Specialisaties</th><th>Status</th><th></th></tr>`+mem.map(m=>`<tr class="mrow" data-m="${m.id}" data-s="${esc((m.name||"").toLowerCase())}"${q&&!(m.name||"").toLowerCase().includes(q)?' style="display:none"':""}><td><input class="mn" value="${esc(m.name)}"></td><td><select class="mr">${cfg.ranks.map((r,i)=>`<option value="${i}"${rankIdx(m)===i?" selected":""}>${esc(r.n)}</option>`).join("")}</select></td><td><input class="mh" type="number" min="0" step="0.1" value="${hrs(m.t)}" style="width:90px"></td><td><div class="chips">${cfg.specs.map(sx=>`<label class="chip${(m.specs||[]).includes(sx)?" on":""}"><input type="checkbox" class="ms" value="${esc(sx)}"${(m.specs||[]).includes(sx)?" checked":""}>${esc(sx)}</label>`).join("")}</div></td><td>${m.since?'<span class="dot"></span>In dienst':'<span class="mu">Offline</span>'}</td><td><div class="row" style="flex-wrap:nowrap"><button class="s p" onclick="saveMember('${m.id}')">Opslaan</button>${m.since?`<button class="s" onclick="clockOut('${m.id}')">Uitklokken</button>`:""}<button class="s" onclick="promote('${m.id}')" title="Promoveer">▲</button><button class="s" onclick="demote('${m.id}')" title="Degradeer">▼</button><button class="s r" onclick="delMember('${m.id}')" title="Verwijderen">✕</button></div></td></tr>`).join("")+`</table></div>`:`<p class="mu">Nog geen leden.</p>`}</div>`;
    }
    if(msec==="discord")h+=`<div class="card"><h2>Discord</h2><p class="mu">Plak de invite-link van je Discord-server. Bovenaan de site komt dan een Discord-knop.</p><label class="f">Invite-link<input id="c_dc" value="${esc(cfg.discord)}" placeholder="https://discord.gg/..."></label><div class="row" style="margin-top:12px"><button class="p" onclick="saveDc()">Opslaan</button></div></div>`;
  }
  const ae=document.activeElement;if(ae&&$("#app").contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
  $("#app").innerHTML=h;
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&loaded)load()});
setInterval(()=>{if(loaded&&!document.hidden)load()},5000);
load();
</script></body></html>
